services:
  - type: web
    name: n8n
    runtime: image
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    plan: free
    region: singapore

    envVars:
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host

      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password

      - key: N8N_HOST
        value: n8n.onrender.com

      - key: N8N_PORT
        value: "5678"

      - key: N8N_PROTOCOL
        value: https

      - key: NODE_ENV
        value: production

      - key: WEBHOOK_URL
        value: https://n8n.onrender.com/

    healthCheckPath: /healthz

databases:
  - name: n8n-postgres
    plan: free
    postgresMajorVersion: "18"
