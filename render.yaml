# Deploy n8n on Render with PostgreSQL

services:
  - type: web
    plan: free
    runtime: image
    name: n8n-service

    image:
      # OLD n8n v1 version
      url: docker.io/n8nio/n8n:1.123.81

    envVars:

      # Encryption key
      - key: N8N_ENCRYPTION_KEY
        generateValue: true

      # PostgreSQL
      - key: DB_TYPE
        value: postgresdb

      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database

      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host

      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user

databases:
  - name: n8n-db
    plan: free
